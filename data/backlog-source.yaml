# Nguồn backlog duy nhất của LAB-5 (Product B, Yuki Cold Chain WMS/TMS).
# Mọi bảng trong md và mọi issue trên GitHub Project sinh từ file này bằng script, không gõ tay.
#
# Quy ước:
#   epic.lab1     : mã task LAB-1 (06-estimate-wbs JSON) mà epic thay thế, dùng cho estimate.md mục 5.
#   issue.code_h  : giờ viết code thuần của issue lá (người ước). Giờ ước lượng = code_h × (1 + hệ số) theo meta.estimate_rule
#                   (unit test, tích hợp, review + sửa sau review), làm tròn lên giờ nguyên. Issue cha = tổng con.
#   issue.pure    : true = module thuần không đụng DB / API (không cộng hệ số tích hợp).
#   issue.hours_override : giờ chốt tay khi quy tắc không hợp, bắt buộc kèm override_why.
#   issue thô (kind: coarse): chưa có spec LAB-4, giờ = tổng MD LAB-1 × 8 (script tính từ lab1), chưa được kéo vào sprint.
#   refs          : mã LAB-4 (SPEC/TECH/API/DB/ADR/G-xx/Q-xx/P-xx) hoặc LAB-1 (F/S/US). "cấm bịa": không có ref thì không có issue.
#   kind          : feat (làm mới / port từ prototype) · gap (sửa chỗ prototype ≠ thiết kế) · test · clarify (hỏi khách) · spike · coarse
#   owner         : người phụ trách giả định, theo đội hình P2 của LAB-1 (06-estimate-wbs mục 3).

meta:
  project: Yuki Cold Chain WMS/TMS — backlog P2
  source_lab4: lab-4-design/specs (nộp 2026-11-11, bản sau PL review vòng 7)
  md_hours: 8
  max_leaf_hours: 24     # issue lá > 24h phải tách sub-issue (trừ issue thô)
  # Quy tắc ra giờ theo định nghĩa xong (PL chọn 2026-11-11): code + unit test + tích hợp + review và sửa sau review.
  estimate_rule:
    be:       {test: 0.40, integ: 0.20, review: 0.15}   # BE có DB / migration / API
    be_pure:  {test: 0.40, integ: 0.00, review: 0.15}   # BE module quy tắc thuần (ADR-003)
    fe:       {test: 0.20, integ: 0.30, review: 0.15}   # FE màn hình gọi API: nối API, trạng thái lỗi M_xx, loading
    fe_pure:  {test: 0.20, integ: 0.00, review: 0.15}   # FE không gọi API
    test:     {rerun: 0.25}                              # QA: chạy lại sau khi dev sửa lỗi
    clarify:  {}                                         # hỏi khách: giờ BrSE soạn câu hỏi + ghi kết quả
    spike:    {}
  owners: [PM, BrSE, TL, BE-1, BE-2, BE-3, FE-1, FE-2, FE-3, QA-1, QA-2, Infra]

# Task LAB-1 không thuộc backlog P2 (estimate.md mục 5 vẫn liệt kê để so).
lab1_outside_backlog:
  - {ids: [N1.*], why: 'Thiết kế cơ bản P1 — giai đoạn P1 (2026-10-05 → 11-27) đã kết thúc, kết quả là bộ spec LAB-4 (10 màn hình ★, kiến trúc, DB, API); thiết kế 49 màn hình còn lại nằm trong phần design 48 MD của issue thô (PREMISE S5)'}
  - {ids: [N3.*], why: "Onboarding, họp tuần, demo, steering — overhead quản lý, theo dõi ngoài backlog sản phẩm"}
  - {ids: [N4.15, N4.16, N4.17], why: "Hỗ trợ UAT, sửa lỗi UAT, gói nghiệm thu — thuộc P3, lập backlog khi vào P3"}
  - {ids: [N5.*, N6.*, N7.*], why: "Diễn tập chuyển đổi, cutover, đào tạo — thuộc P3/P4"}
  - {ids: [M.*], why: "PM/BrSE/TL overhead và dự phòng 20% — không chia thành issue; dự phòng dùng khi Q chưa trả lời làm phình issue"}

